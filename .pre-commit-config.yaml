repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # Tiled maps and tilesets use JSON with their own file extensions.
        types: [file]
        files: \.(json|tmj|tsj)$
