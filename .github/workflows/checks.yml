name: Project checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run pre-commit checks
        run: |
          python -m pip install pre-commit==4.6.2
          pre-commit run --all-files --show-diff-on-failure
      - name: Validate formatting and committed versions
        run: |
          cargo fmt --all -- --check
          node .github/scripts/validate-release.mjs
          cargo metadata --no-deps --locked --format-version 1 > /dev/null
      - name: Test packaging and release recovery
        run: |
          node --test .github/scripts/*.test.mjs
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Lint GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo rhysd/actionlint --pattern '*linux_amd64.tar.gz' --dir /tmp/actionlint
          tar -xzf /tmp/actionlint/actionlint_*_linux_amd64.tar.gz -C /tmp/actionlint
          /tmp/actionlint/actionlint -color
      - name: Install Worker dependencies
        run: npm ci --prefix server
      - name: Test Rust server through Cloudflare gateway and compatibility address
        run: |
          cd server
          npm run dev > /tmp/yapshire-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true; cat /tmp/yapshire-worker.log' EXIT
          # A cold runner must build the Rust container before the gateways can start.
          ready=false
          for _ in {1..180}; do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health; then
              ready=true
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          if [ "$ready" != true ]; then exit 1; fi
          npm test
          CLUB_URL=http://127.0.0.1:8787 CLUB_CAPACITY_CHECK=1 npm run test:club
          npx wrangler deploy --dry-run
          npm run deploy:club -- --dry-run
